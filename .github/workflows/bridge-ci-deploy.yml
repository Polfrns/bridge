name: Bridge CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_REPOSITORY: ghcr.io/polfrns/bridge

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Build and test, then publish on main
        env:
          CI_REGISTRY_PUSH_USER: ${{ github.actor }}
          CI_REGISTRY_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            bash ci/cloud-build.sh bridge publish
          else
            bash ci/cloud-build.sh bridge test
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          name: bridge-ci-result
          path: ci-result.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: [self-hosted, linux, bridge-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: bridge-ci-result
      - name: Deploy the tested image
        env:
          CI_IMAGE_REPOSITORY: ghcr.io/polfrns/bridge
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BRIDGE_DEPLOY_DIR: ${{ vars.BRIDGE_DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          bash ci/deploy.sh bridge
